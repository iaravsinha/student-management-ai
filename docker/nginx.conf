resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
    keepalive 32;
}

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8000 resolve;
    keepalive 32;
}

upstream ai_upstream {
    zone ai_upstream 64k;
    server ai-service:8001 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- HTTPS-ready ---
    # To enable TLS:
    # 1) mount certificates to /etc/nginx/certs
    # 2) uncomment the SSL server block below
    # 3) change HTTP block to redirect to https
    #
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;

    # Disable caching for static assets during development to avoid hydration mismatches
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Dedicated block for Next.js Fast Refresh WebSockets
    location /_next/webpack-hmr {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Forwarded-Prefix /api;

        # FastAPI/Starlette may redirect `/resource` -> `/resource/` without knowing about `/api`.
        # Rewrite redirect locations so clients stay under `/api/...`.
        proxy_redirect ~^/(.*)$ /api/$1;
        proxy_redirect ~^http://([^/]+)/(.*)$ $client_proto://$1/api/$2;
        proxy_redirect ~^https://([^/]+)/(.*)$ $client_proto://$1/api/$2;
    }

    location /ai/ {
        proxy_pass http://ai_upstream/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
}

