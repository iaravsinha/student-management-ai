name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 4. Install dependencies
        run: |
          # Backend
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

          # AI Service
          pip install -r ai-service/requirements.txt

          # Frontend
          cd frontend
          npm install
          cd ..

      - name: 5. Run tests
        run: |
          # Run Backend tests
          cd backend
          export PYTHONPATH=.
          python -m pytest tests
          cd ..

          # Run AI Service tests
          cd ai-service
          export PYTHONPATH=.
          python -m pytest tests
          cd ..

      - name: 6. Build Docker images
        run: docker compose build

      - name: 7. Run lint checks
        run: |
          cd backend
          ruff check .
          cd ..

          cd ai-service
          ruff check .
          cd ..

          cd frontend
          npm run lint
          cd ..

